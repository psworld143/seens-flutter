name: seens_flutter
description: Student Entry and Exit Notification System - Flutter Version

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  
  # Image & Camera
  camera: ^0.10.5+5
  image_picker: ^1.0.7
  
  # NFC/RFID
  nfc_manager: ^3.5.0
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Utils
  intl: ^0.19.0
  logger: ^2.0.2+1

  # Audio
  audioplayers: ^5.2.1
  
  # Security
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
